resources:
  repositories:
  - repository: other
    type: github
    name: myorg/other-repo        # note: name includes the owner
    endpoint: MyGitHubServiceConnection

trigger: none
pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
- checkout: other

- bash: |
    echo "Build.SourcesDirectory = $(Build.SourcesDirectory)"
    find $(Pipeline.Workspace) -maxdepth 4 -type d
  displayName: Show paths