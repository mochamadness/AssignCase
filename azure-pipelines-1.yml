resources:
  repositories:
  - repository: other
    type: github
    name: mochamadness/terraformTest
    endpoint: github.com_mochamadness

trigger: none
pool:
  vmImage: ubuntu-latest

steps:
- checkout: self
- checkout: other
- bash: |
    echo "Build.SourcesDirectory = $(Build.SourcesDirectory)"
    find $(Pipeline.Workspace) -maxdepth 4 -type d -not -path "*/.git*"
  displayName: Show paths